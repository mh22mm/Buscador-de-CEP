<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de CEP</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #172b3a;
      background: #eef5f6;
    }
    main {
      width: 100%;
      max-width: 510px;
      padding: 30px;
      background: #fff;
      border: 1px solid #dbe7e9;
      border-radius: 20px;
      box-shadow: 0 16px 40px #172b3a10;
    }
    h1 { margin: 0 0 10px; font-size: 1.8rem; }
    p { line-height: 1.5; }
    .descricao, small { color: #526874; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input, button { font: inherit; border-radius: 9px; padding: 13px; }
    input { width: 100%; border: 1px solid #91a7af; font-size: 1.15rem; }
    small { display: block; margin-top: 7px; }
    .acoes { display: flex; gap: 10px; margin-top: 18px; }
    button { flex: 1; border: 0; background: #087f75; color: white; font-weight: 650; cursor: pointer; }
    button:hover { background: #07695f; }
    button[type="reset"] { flex: 0 0 auto; background: #edf2f4; color: #243f4b; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #23b5a7; outline-offset: 3px; }
    #mensagem { margin: 18px 0 0; min-height: 1.5em; }
    #mensagem.erro { color: #b32b36; }
    #endereco { margin-top: 20px; border-top: 1px solid #dbe7e9; padding-top: 20px; }
    h2 { font-size: 1.15rem; margin: 0 0 16px; }
    dl { display: grid; gap: 14px; margin: 0; }
    dt { color: #526874; font-size: .85rem; }
    dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    footer { margin-top: 26px; font-size: .85rem; color: #526874; }
    a { color: #086b63; }
  </style>
</head>
<body>
  <main>
    <h1>Buscador de CEP</h1>
    <p class="descricao">Digite um CEP para consultar o endereço.</p>

    <form id="formulario" novalidate>
      <label for="cep">CEP</label>
      <input id="cep" name="cep" type="text" inputmode="numeric"
        autocomplete="postal-code" placeholder="Ex.: 01001-000"
        aria-describedby="ajuda" required>
      <small id="ajuda">Use 8 números, com ou sem hífen.</small>
      <div class="acoes">
        <button id="buscar" type="submit">Buscar endereço</button>
        <button type="reset">Limpar</button>
      </div>
    </form>

    <p id="mensagem" role="status" aria-live="polite" aria-atomic="true"></p>

    <section id="endereco" aria-labelledby="titulo-endereco" hidden>
      <h2 id="titulo-endereco">Endereço encontrado</h2>
      <dl>
        <div><dt>CEP</dt><dd id="resultado-cep"></dd></div>
        <div><dt>Logradouro</dt><dd id="logradouro"></dd></div>
        <div><dt>Complemento</dt><dd id="complemento"></dd></div>
        <div><dt>Bairro</dt><dd id="bairro"></dd></div>
        <div><dt>Cidade</dt><dd id="cidade"></dd></div>
        <div><dt>UF</dt><dd id="uf"></dd></div>
        <div><dt>DDD</dt><dd id="ddd"></dd></div>
      </dl>
    </section>

    <footer>Consulta via <a href="https://viacep.com.br/" target="_blank" rel="noopener noreferrer">ViaCEP</a>. Precisa de internet.</footer>
  </main>

  <script>
    const formulario = document.getElementById('formulario');
    const campoCep = document.getElementById('cep');
    const botaoBuscar = document.getElementById('buscar');
    const mensagem = document.getElementById('mensagem');
    const endereco = document.getElementById('endereco');
    let controlador = null;
    let consultaAtual = 0;

    function avisar(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.classList.toggle('erro', erro);
    }

    function carregando(ativo) {
      botaoBuscar.disabled = ativo;
      campoCep.disabled = ativo;
      botaoBuscar.textContent = ativo ? 'Buscando…' : 'Buscar endereço';
      formulario.setAttribute('aria-busy', String(ativo));
    }

    // Cada consulta recebe um identificador para ignorar respostas antigas.
    formulario.addEventListener('submit', async function (evento) {
      evento.preventDefault();
      const idConsulta = ++consultaAtual;
      if (controlador) controlador.abort();
      endereco.hidden = true;
      campoCep.removeAttribute('aria-invalid');

      const digitado = campoCep.value.trim();
      if (!/^\d{5}-?\d{3}$/.test(digitado)) {
        carregando(false);
        campoCep.setAttribute('aria-invalid', 'true');
        avisar('Digite um CEP válido com 8 números. Exemplo: 01001-000.', true);
        campoCep.focus();
        return;
      }

      const cep = digitado.replace('-', '');
      const controle = new AbortController();
      controlador = controle;
      let tempoEsgotado = false;
      const limite = setTimeout(function () {
        tempoEsgotado = true;
        controle.abort();
      }, 10000);

      carregando(true);
      avisar('Consultando endereço…');

      try {
        const resposta = await fetch('https://viacep.com.br/ws/' + cep + '/json/', {
          signal: controle.signal
        });
        if (!resposta.ok) throw new Error('Falha na consulta. Tente novamente em instantes.');
        const dados = await resposta.json();
        if (idConsulta !== consultaAtual) return;
        if (!dados || typeof dados !== 'object' || Array.isArray(dados)) {
          throw new Error('O serviço retornou uma resposta inválida. Tente novamente.');
        }
        if (dados.erro) throw new Error('CEP não encontrado. Confira os números e tente novamente.');
        if (!dados.cep || !dados.localidade || !dados.uf) {
          throw new Error('O serviço retornou uma resposta incompleta. Tente novamente.');
        }

        const campos = {
          'resultado-cep': dados.cep,
          logradouro: dados.logradouro,
          complemento: dados.complemento,
          bairro: dados.bairro,
          cidade: dados.localidade,
          uf: dados.uf,
          ddd: dados.ddd
        };

        // textContent exibe os dados como texto, sem interpretar HTML.
        for (const [id, valor] of Object.entries(campos)) {
          document.getElementById(id).textContent = valor || 'Não informado';
        }
        campoCep.value = dados.cep;
        endereco.hidden = false;
        avisar('Endereço encontrado.');
      } catch (erro) {
        if (idConsulta !== consultaAtual) return;
        if (tempoEsgotado) {
          avisar('A consulta demorou demais. Tente novamente.', true);
        } else if (erro.name !== 'AbortError') {
          avisar(erro instanceof TypeError
            ? 'Não foi possível conectar. Verifique sua internet e tente novamente.'
            : erro instanceof SyntaxError
              ? 'O serviço retornou uma resposta inválida. Tente novamente.'
              : erro.message, true);
        }
      } finally {
        clearTimeout(limite);
        if (idConsulta === consultaAtual) {
          controlador = null;
          carregando(false);
        }
      }
    });

    formulario.addEventListener('reset', function () {
      consultaAtual++;
      if (controlador) controlador.abort();
      controlador = null;
      carregando(false);
      endereco.hidden = true;
      campoCep.removeAttribute('aria-invalid');
      avisar('');
      campoCep.focus();
    });
  </script>
</body>
</html>
